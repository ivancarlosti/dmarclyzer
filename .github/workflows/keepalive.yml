name: Keepalive Workflow

on:
  schedule:
    # Runs every Sunday at 5:45 AM UTC
    - cron: '45 5 * * 0'
  # Allows you to trigger the workflow manually from the GitHub UI for testing
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Keep repository active
        uses: gautamkrishnar/keepalive-workflow@v2