name: 🔐 Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly disclosed advisories are caught without a code change.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit pinned dependencies
        run: pip-audit -r requirements.txt --no-deps --strict

  unit-tests:
    name: Security unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile
        run: python -m compileall -q app tests

      - name: Run tests
        run: python -m unittest discover -s tests -v
